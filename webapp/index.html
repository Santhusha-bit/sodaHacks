<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>DigiGuide — Road Crossing Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet" />

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* ── Three.js canvas fills everything ── */
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        canvas {
            display: block;
        }

        /* ── UI overlay ── */
        #ui {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* ── Top bar ── */
        #topbar {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            padding: 24px 28px 0;
            pointer-events: all;
        }


        .logo-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, .35);
            margin-bottom: 4px;
        }

        .logo-title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #7ee8fa, #80ff72);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: background 0.8s;
        }

        .logo-sub {
            font-size: 11px;
            color: rgba(255, 255, 255, .4);
            margin-top: 2px;
        }

        .topbar-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        /* WS badge */
        #ws-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            padding: 5px 12px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, .12);
            background: rgba(0, 0, 0, .45);
            backdrop-filter: blur(8px);
            color: rgba(255, 255, 255, .5);
            transition: all 0.4s;
        }

        #ws-badge.live {
            border-color: #22d3a0;
            color: #22d3a0;
        }

        #ws-badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        /* Mode toggle */
        .mode-toggle {
            display: flex;
            background: rgba(0, 0, 0, .5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 999px;
            padding: 3px;
            gap: 2px;
        }

        .mode-btn {
            padding: 5px 14px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, .4);
            transition: all 0.3s;
            pointer-events: all;
        }

        .mode-btn.active {
            background: rgba(255, 255, 255, .12);
            color: #fff;
        }

        /* ── Center hazard label ── */
        #center-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
        }

        #hazard-word {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.7;
            transition: color 0.8s;
        }

        /* ── Bottom alert tray ── */
        #bottom-tray {
            padding: 0 28px 28px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: stretch;
            pointer-events: none;
        }

        /* Alert card */
        #alert-card {
            background: rgba(0, 0, 0, .55);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            transition: border-color 0.6s, background 0.6s;
        }

        #alert-card.caution {
            border-color: rgba(245, 158, 11, .3);
            background: rgba(16, 10, 0, .6);
        }

        #alert-card.danger {
            border-color: rgba(239, 68, 68, .4);
            background: rgba(20, 0, 0, .65);
        }

        .alert-icon {
            font-size: 22px;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .alert-body {
            flex: 1;
        }

        .alert-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, .35);
            margin-bottom: 3px;
        }

        #alert-text {
            font-size: 13.5px;
            font-weight: 500;
            color: rgba(255, 255, 255, .85);
            line-height: 1.5;
            font-style: italic;
            transition: color 0.4s;
            min-height: 20px;
        }

        /* Chips row */
        .chips-row {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .chip {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9.5px;
            color: rgba(255, 255, 255, .4);
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 999px;
            padding: 3px 10px;
            letter-spacing: .5px;
        }

        #haptic-chip {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9.5px;
            color: #7ee8fa;
            background: rgba(126, 232, 250, .07);
            border: 1px solid rgba(126, 232, 250, .15);
            border-radius: 999px;
            padding: 3px 10px;
            transition: color 0.5s, border-color 0.5s, background 0.5s;
        }

        /* Distance bar (deaf mode only) */
        #distance-wrap {
            display: none;
            align-items: center;
            gap: 10px;
        }

        #distance-wrap.visible {
            display: flex;
        }

        #distance-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: rgba(255, 255, 255, .4);
            white-space: nowrap;
        }

        #distance-bar-bg {
            flex: 1;
            height: 5px;
            background: rgba(255, 255, 255, .08);
            border-radius: 999px;
            overflow: hidden;
        }

        #distance-bar-fill {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #22d3a0, #7ee8fa);
            transition: width 0.6s cubic-bezier(.4, 0, .2, 1), background 0.6s;
            width: 0%;
        }

        #distance-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: rgba(255, 255, 255, .4);
            width: 40px;
            text-align: right;
        }

        /* Scan lines overlay (subtle) */
        #scanlines {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 0, 0, .025) 2px,
                    rgba(0, 0, 0, .025) 4px);
            pointer-events: none;
            z-index: 5;
        }

        /* State-based logo gradient */
        .logo-title.caution {
            background: linear-gradient(135deg, #fde68a, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .logo-title.danger {
            background: linear-gradient(135deg, #fca5a5, #ef4444);
            -webkit-background-clip: text;
            background-clip: text;
        }

        /* Demo mode notice */
        #demo-notice {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, .25);
            pointer-events: none;
            z-index: 20;
            transition: opacity 1s;
        }
    </style>
</head>

<body>

    <div id="canvas-container"></div>
    <div id="scanlines"></div>

    <!-- Vertex Shader -->
    <script id="vertexshader" type="x-shader/x-vertex">
  uniform float u_time;
  uniform float u_amplitude;

  vec3 mod289(vec3 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
  vec4 mod289(vec4 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
  vec4 permute(vec4 x) { return mod289(((x*34.0)+10.0)*x); }
  vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
  vec3 fade(vec3 t) { return t*t*t*(t*(t*6.0-15.0)+10.0); }

  float pnoise(vec3 P, vec3 rep) {
    vec3 Pi0 = mod(floor(P), rep);
    vec3 Pi1 = mod(Pi0 + vec3(1.0), rep);
    Pi0 = mod289(Pi0);
    Pi1 = mod289(Pi1);
    vec3 Pf0 = fract(P);
    vec3 Pf1 = Pf0 - vec3(1.0);
    vec4 ix = vec4(Pi0.x, Pi1.x, Pi0.x, Pi1.x);
    vec4 iy = vec4(Pi0.yy, Pi1.yy);
    vec4 iz0 = Pi0.zzzz;
    vec4 iz1 = Pi1.zzzz;
    vec4 ixy = permute(permute(ix) + iy);
    vec4 ixy0 = permute(ixy + iz0);
    vec4 ixy1 = permute(ixy + iz1);
    vec4 gx0 = ixy0 * (1.0/7.0);
    vec4 gy0 = fract(floor(gx0) * (1.0/7.0)) - 0.5;
    gx0 = fract(gx0);
    vec4 gz0 = vec4(0.5) - abs(gx0) - abs(gy0);
    vec4 sz0 = step(gz0, vec4(0.0));
    gx0 -= sz0 * (step(0.0, gx0) - 0.5);
    gy0 -= sz0 * (step(0.0, gy0) - 0.5);
    vec4 gx1 = ixy1 * (1.0/7.0);
    vec4 gy1 = fract(floor(gx1) * (1.0/7.0)) - 0.5;
    gx1 = fract(gx1);
    vec4 gz1 = vec4(0.5) - abs(gx1) - abs(gy1);
    vec4 sz1 = step(gz1, vec4(0.0));
    gx1 -= sz1 * (step(0.0, gx1) - 0.5);
    gy1 -= sz1 * (step(0.0, gy1) - 0.5);
    vec3 g000 = vec3(gx0.x, gy0.x, gz0.x);
    vec3 g100 = vec3(gx0.y, gy0.y, gz0.y);
    vec3 g010 = vec3(gx0.z, gy0.z, gz0.z);
    vec3 g110 = vec3(gx0.w, gy0.w, gz0.w);
    vec3 g001 = vec3(gx1.x, gy1.x, gz1.x);
    vec3 g101 = vec3(gx1.y, gy1.y, gz1.y);
    vec3 g011 = vec3(gx1.z, gy1.z, gz1.z);
    vec3 g111 = vec3(gx1.w, gy1.w, gz1.w);
    vec4 norm0 = taylorInvSqrt(vec4(dot(g000,g000),dot(g010,g010),dot(g100,g100),dot(g110,g110)));
    g000 *= norm0.x; g010 *= norm0.y; g100 *= norm0.z; g110 *= norm0.w;
    vec4 norm1 = taylorInvSqrt(vec4(dot(g001,g001),dot(g011,g011),dot(g101,g101),dot(g111,g111)));
    g001 *= norm1.x; g011 *= norm1.y; g101 *= norm1.z; g111 *= norm1.w;
    float n000 = dot(g000, Pf0);
    float n100 = dot(g100, vec3(Pf1.x, Pf0.yz));
    float n010 = dot(g010, vec3(Pf0.x, Pf1.y, Pf0.z));
    float n110 = dot(g110, vec3(Pf1.xy, Pf0.z));
    float n001 = dot(g001, vec3(Pf0.xy, Pf1.z));
    float n101 = dot(g101, vec3(Pf1.x, Pf0.y, Pf1.z));
    float n011 = dot(g011, vec3(Pf0.x, Pf1.yz));
    float n111 = dot(g111, Pf1);
    vec3 fade_xyz = fade(Pf0);
    vec4 n_z = mix(vec4(n000,n100,n010,n110), vec4(n001,n101,n011,n111), fade_xyz.z);
    vec2 n_yz = mix(n_z.xy, n_z.zw, fade_xyz.y);
    float n_xyz = mix(n_yz.x, n_yz.y, fade_xyz.x);
    return 2.2 * n_xyz;
  }

  void main() {
    float noise = u_amplitude * pnoise(position + u_time * 0.3, vec3(10.0));
    float displacement = noise / 10.0;
    vec3 newPosition = position + normal * displacement;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
  }
</script>

    <!-- Fragment Shader -->
    <script id="fragmentshader" type="x-shader/x-fragment">
  uniform float u_red;
  uniform float u_green;
  uniform float u_blue;
  void main() {
    gl_FragColor = vec4(u_red, u_green, u_blue, 1.0);
  }
</script>

    <!-- Three.js via importmap -->
    <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
  }
}
</script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // ── Renderer ─────────────────────────────────────────────────────────────────
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // ── Scene & Camera ───────────────────────────────────────────────────────────
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 16);

        // ── Uniforms ─────────────────────────────────────────────────────────────────
        const uniforms = {
            u_time: { value: 0.0 },
            u_amplitude: { value: 3.0 },
            u_red: { value: 0.1 },
            u_green: { value: 0.9 },
            u_blue: { value: 1.0 },
        };

        // ── Blob Mesh ─────────────────────────────────────────────────────────────────
        const mat = new THREE.ShaderMaterial({
            wireframe: true,
            uniforms,
            vertexShader: document.getElementById('vertexshader').textContent,
            fragmentShader: document.getElementById('fragmentshader').textContent,
        });
        const geo = new THREE.IcosahedronGeometry(4, 30);
        const mesh = new THREE.Mesh(geo, mat);
        scene.add(mesh);

        // ── Post-processing: UnrealBloom ──────────────────────────────────────────────
        const renderScene = new RenderPass(scene, camera);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight)
        );
        bloomPass.threshold = 0.0;
        bloomPass.strength = 0.5;
        bloomPass.radius = 0.8;

        const outputPass = new OutputPass();

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);
        composer.addPass(outputPass);

        // ── Orb State Machine ─────────────────────────────────────────────────────────
        const STATES = {
            safe: { r: 0.10, g: 0.90, b: 1.00, amp: 3.0, bloom: 0.50, speed: 0.30, label: 'ALL CLEAR', word_color: '#7ee8fa', card: '', icon: '🔊', grad: 'safe' },
            caution: { r: 1.00, g: 0.70, b: 0.10, amp: 6.5, bloom: 0.90, speed: 0.55, label: 'CAUTION', word_color: '#fbbf24', card: 'caution', icon: '⚠️', grad: 'caution' },
            danger: { r: 1.00, g: 0.12, b: 0.08, amp: 11.0, bloom: 1.50, speed: 0.90, label: 'DANGER — STOP!', word_color: '#f87171', card: 'danger', icon: '🚨', grad: 'danger' },
        };

        let currentState = 'safe';
        let targetR = 0.10, targetG = 0.90, targetB = 1.00;
        let targetAmp = 3.0, targetBloom = 0.50;
        let currentMode = localStorage.getItem('dg_mode') || 'blind';

        function applyState(name) {
            const s = STATES[name] || STATES.safe;
            currentState = name;
            targetR = s.r; targetG = s.g; targetB = s.b;
            targetAmp = s.amp; targetBloom = s.bloom;

            // UI updates
            document.getElementById('hazard-word').textContent = s.label;
            document.getElementById('hazard-word').style.color = s.word_color;
            document.getElementById('alert-card').className = 'alert-card' + (s.card ? ' ' + s.card : '');
            document.getElementById('alert-icon').textContent = s.icon;

            const logo = document.getElementById('logo-title');
            logo.className = 'logo-title' + (s.grad !== 'safe' ? ' ' + s.grad : '');

            // Haptic chip
            const hapticMap = { safe: 'calm', caution: 'pulse', danger: 'rapid' };
            const hc = document.getElementById('haptic-chip');
            hc.textContent = '📳 haptic: ' + (hapticMap[name] || 'calm');
            hc.style.color = s.word_color;
            hc.style.borderColor = s.word_color + '44';
            hc.style.background = s.word_color + '11';

            // Distance fill (deaf mode)
            const distPct = name === 'danger' ? 90 : name === 'caution' ? 45 : 5;
            document.getElementById('distance-bar-fill').style.width = distPct + '%';
            if (name === 'danger') {
                document.getElementById('distance-bar-fill').style.background = 'linear-gradient(90deg,#f87171,#ef4444)';
            } else if (name === 'caution') {
                document.getElementById('distance-bar-fill').style.background = 'linear-gradient(90deg,#fbbf24,#f59e0b)';
            } else {
                document.getElementById('distance-bar-fill').style.background = 'linear-gradient(90deg,#22d3a0,#7ee8fa)';
            }
        }

        // ── Smooth lerp tick ──────────────────────────────────────────────────────────
        function lerpUniforms() {
            const k = 0.035;
            uniforms.u_red.value += (targetR - uniforms.u_red.value) * k;
            uniforms.u_green.value += (targetG - uniforms.u_green.value) * k;
            uniforms.u_blue.value += (targetB - uniforms.u_blue.value) * k;
            uniforms.u_amplitude.value += (targetAmp - uniforms.u_amplitude.value) * k;
            bloomPass.strength += (targetBloom - bloomPass.strength) * k;
        }

        // ── Mouse tracking camera ─────────────────────────────────────────────────────
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) / 100;
            mouseY = (e.clientY - window.innerHeight / 2) / 100;
        });

        // ── Animation loop ────────────────────────────────────────────────────────────
        const clock = new THREE.Clock();
        const STATES_SPEED = { safe: 0.30, caution: 0.55, danger: 0.90 };

        function animate() {
            const speed = STATES_SPEED[currentState] || 0.30;
            uniforms.u_time.value = clock.getElapsedTime() * speed;

            // Camera follows mouse
            camera.position.x += (mouseX - camera.position.x) * 0.04;
            camera.position.y += (-mouseY - camera.position.y) * 0.4;
            camera.lookAt(scene.position);

            lerpUniforms();
            composer.render();
            requestAnimationFrame(animate);
        }
        animate();

        // ── Resize ────────────────────────────────────────────────────────────────────
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // ── Mode toggle ───────────────────────────────────────────────────────────────
        window.setMode = function (mode) {
            currentMode = mode;
            localStorage.setItem('dg_mode', mode);

            document.getElementById('btn-blind').classList.toggle('active', mode === 'blind');
            document.getElementById('btn-deaf').classList.toggle('active', mode === 'deaf');

            const dw = document.getElementById('distance-wrap');
            dw.classList.toggle('visible', mode === 'deaf');

            document.getElementById('alert-label').textContent =
                mode === 'blind' ? 'Last Voice Alert' : 'Screen Warning';
            document.getElementById('alert-icon').textContent =
                mode === 'blind' ? (currentState === 'danger' ? '🚨' : '🔊') : '🖥';
        };
        setMode(currentMode);

        // ── WebSocket ─────────────────────────────────────────────────────────────────
        const WS_URL = 'ws://localhost:8765';
        let ws = null, demoInterval = null, wsAlive = false;

        function startDemo() {
            const cycle = ['safe', 'safe', 'caution', 'caution', 'danger', 'safe'];
            let i = 0;
            if (demoInterval) clearInterval(demoInterval);
            demoInterval = setInterval(() => {
                applyState(cycle[i % cycle.length]);
                if (currentState === 'caution' || currentState === 'danger') {
                    const samples = {
                        caution: '"Heads up — motion detected nearby. Stay aware."',
                        danger: '"Warning. Car approaching from your left, approximately 8 feet."',
                    };
                    document.getElementById('alert-text').textContent = samples[currentState] || '';
                    document.getElementById('distance-val').textContent =
                        currentState === 'danger' ? '8 ft' : '22 ft';
                } else {
                    document.getElementById('alert-text').innerHTML =
                        '<span style="opacity:.35">All clear. Roads are safe — no hazards detected.</span>';
                    document.getElementById('distance-val').textContent = '— ft';
                }
                i++;
            }, 3800);
        }

        function connectWS() {
            try {
                ws = new WebSocket(WS_URL);
                ws.onopen = () => {
                    wsAlive = true;
                    if (demoInterval) { clearInterval(demoInterval); demoInterval = null; }
                    document.getElementById('demo-notice').style.opacity = '0';
                    const badge = document.getElementById('ws-badge');
                    badge.classList.add('live');
                    document.getElementById('ws-text').textContent = 'Live';
                };
                ws.onmessage = (evt) => {
                    try {
                        const state = JSON.parse(evt.data);
                        const lvl = (state.level || 'SAFE').toLowerCase();
                        applyState(lvl === 'safe' ? 'safe' : lvl === 'caution' ? 'caution' : 'danger');
                        if (state.speech) {
                            document.getElementById('alert-text').textContent = `"${state.speech}"`;
                        }
                        if (state.haptic) {
                            document.getElementById('haptic-chip').textContent = '📳 haptic: ' + state.haptic;
                        }
                        // Distance from PIR / precedence array
                        const dist = state.distance_ft || null;
                        if (dist) {
                            document.getElementById('distance-val').textContent = dist + ' ft';
                            const pct = Math.min(100, (30 - dist) / 30 * 100);
                            document.getElementById('distance-bar-fill').style.width = Math.max(0, pct) + '%';
                        }
                    } catch (e) { console.warn('WS parse error', e); }
                };
                ws.onclose = () => {
                    wsAlive = false;
                    document.getElementById('ws-badge').classList.remove('live');
                    document.getElementById('ws-text').textContent = 'Offline';
                    document.getElementById('demo-notice').style.opacity = '1';
                    startDemo();
                    setTimeout(connectWS, 5000);
                };
                ws.onerror = () => ws.close();
            } catch (e) {
                startDemo();
            }
        }

        // Start demo immediately, WS overrides it when connected
        startDemo();
        connectWS();

    </script>
</body>
